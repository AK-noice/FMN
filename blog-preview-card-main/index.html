<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
  @font-face {
  font-family: Figtree;
  src: url(./assets/fonts/static/Figtree-ExtraBold.ttf);
  font-weight: bold;
  }
  @font-face {
  font-family: Figtree;
  src: url(./assets/fonts/static/Figtree-Medium.ttf);
  font-weight: medium;
  }

    body{
      font-family: Figtree, sans-serif;
      background-color: hsl(47, 88%, 63%);
    }

    .card {
      background-color: hsl(0, 0%, 100%);
      width: 300px;
    }

    button {
      background-color: hsl(47, 88%, 63%);
      color: hsl(0, 0%, 7%);
      border: none;
      cursor: pointer;
    }
    h5{
      color: hsl(0, 0%, 7%);
    }
    h1{
      color: hsl(0, 0%, 7%);
    }
    p{
      color: hsl(0, 0%, 42%);
      font-size: 16px;
    }
    h6{
      color: hsl(0, 0%, 7%);
    }










    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="card">
    <img src="./assets/images/illustration-article.svg" alt="Article Illustration" class="article_img"/>
    <button type="url">Learning</button>
    <h5>Published 21 Dec 2023</h5>
    <h1>HTML & CSS foundations</h1>
    <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>

    <div class="grid_tutor">
      <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="tutor_img"/>
      <h6>Greg Hooper</h6>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
