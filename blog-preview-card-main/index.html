<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
  @font-face {
  font-family: Figtree;
  src: url(./assets/fonts/static/Figtree-ExtraBold.ttf);
  font-weight: bold;
  }
  @font-face {
  font-family: Figtree;
  src: url(./assets/fonts/static/Figtree-Medium.ttf);
  font-weight: medium;
  }

    body{
      font-family: Figtree, sans-serif;
      background-color: hsl(47, 88%, 63%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background-color: hsl(0, 0%, 100%);
      width: 376px;
      border-radius: 20px;
      border: 1px solid hsl(0, 0%, 7%);
      box-shadow: 8px 8px hsl(0, 0%, 7%);
      padding: 24px;
    }

    button {
      font-family: Figtree, sans-serif;
      font-weight: bold;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      background-color: hsl(47, 88%, 63%);
      color: hsl(0, 0%, 7%);
      border: none;
      cursor: pointer;
    }
    #title{
      color: hsl(0, 0%, 7%);
      font-size: 24px;
      font-weight: bold;
    }
    #title:hover{
      transition: color 0.3s ease-in;
      color: hsl(47, 88%, 63%);
      cursor: pointer;
    }
    #date{
      color: hsl(0, 0%, 7%);
      font-size: 14px;
    }
    p{
      color: hsl(0, 0%, 42%);
      font-size: 16px;
    }
    #tutor_name{
      color: hsl(0, 0%, 7%);
    }
    .grid_tutor{
      display: flex;
      align-items: center;
      flex-flow: row;
    }
    .tutor_img{
      width: 32px;
      height: 32px;
      margin-right: 12px;
    }
    .article_img{
      border-radius: 10px;
      width: 100%;
      margin-bottom: 24px;
    }

    @media screen and (min-width: 1080px) {
      #container{
        margin: auto;
      }
    }

    @media screen and (min-width: 540px) {
      #container{
        margin: auto;
      }
    }

    .attribution { font-size: 0.6875rem; display:block; position: fixed; bottom: 0;}
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="card">
    <img src="./assets/images/illustration-article.svg" alt="Article Illustration" class="article_img"/>
    <button type="url">Learning</button>
    <p id="date">Published 21 Dec 2023</p>
    <p id="title">HTML & CSS foundations</p>
    <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>

    <div class="grid_tutor">
      <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="tutor_img"/>
      <h6>Greg Hooper</h6>
    </div> 
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://ak-noice.github.io/FMN/">AK<a>.
  </footer> 
</body>
</html>
